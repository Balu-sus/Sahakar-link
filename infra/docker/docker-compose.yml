version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sahakar_postgres
    environment:
      POSTGRES_USER: sahakar
      POSTGRES_PASSWORD: sahakar_dev_password
      POSTGRES_DB: sahakar_link
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sahakar_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: sahakar_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  qdrant_data:
